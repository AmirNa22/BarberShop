<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم نوبت‌دهی آرایشگاه</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>سامانه نوبت‌دهی آرایشگاه</h1>
            <p class="subtitle">بررسی اتصال فرانت‌اند و بک‌اند</p>
        </header>

        <main>
            <div class="card">
                <h2>وضعیت ارتباط با سرور</h2>
                <div id="status-box" class="status-box loading">
                    <span class="icon">⏳</span>
                    <span id="status-message">در حال دریافت پاسخ از سرور...</span>
                </div>
                <button id="retry-btn" class="btn" style="display: none;">تلاش مجدد</button>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
